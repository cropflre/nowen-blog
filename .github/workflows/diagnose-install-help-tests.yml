name: Diagnose install help tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/nowen-note-install-help

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_PATH: ${{ github.workspace }}/.tmp/diagnose/blog.sqlite
      UPLOAD_DIR: ${{ github.workspace }}/.tmp/diagnose/uploads
      BASE_URL: http://127.0.0.1:6688
      SESSION_SECRET: diagnose-session-secret-at-least-32-characters
      ADMIN_USERNAME: NOWEN
      ADMIN_EMAIL: diagnose@example.com
      ADMIN_PASSWORD: diagnose-admin-password
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture full test output
        shell: bash
        run: |
          mkdir -p .tmp/diagnose
          set +e
          pnpm test 2>&1 | tee .tmp/diagnose/test.log
          code=${PIPESTATUS[0]}
          echo "$code" > .tmp/diagnose/exit-code.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: install-help-test-diagnostics
          path: .tmp/diagnose
