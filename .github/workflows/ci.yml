name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, tests, migrations and full build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      DATABASE_PATH: ${{ github.workspace }}/.tmp/ci/blog.sqlite
      UPLOAD_DIR: ${{ github.workspace }}/.tmp/ci/uploads
      BASE_URL: http://127.0.0.1:6688
      SESSION_SECRET: ci-quality-session-secret-at-least-32-characters
      ADMIN_USERNAME: NOWEN
      ADMIN_EMAIL: ci-quality@example.com
      ADMIN_PASSWORD: ci-quality-admin-password
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Docker release shell
        run: |
          bash -n scripts/release-docker.sh
          bash scripts/release-docker.sh --help >/dev/null

      - name: Validate single-image Docker Bake target
        run: |
          APP_VERSION=0.0.0 \
          VCS_REF=ci \
          BUILD_DATE=2026-01-01T00:00:00Z \
          PLATFORM=linux/amd64 \
          IMAGE_TAGS=nowen-blog:ci \
            docker buildx bake -f docker-bake.hcl --print release >/dev/null

      - name: Validate published-image Compose
        run: docker compose -f docker-compose.release.yml config --quiet

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Run unit and integration tests
        run: pnpm test

      - name: Bootstrap isolated build database
        run: |
          rm -rf .tmp/ci
          mkdir -p .tmp/ci/uploads
          pnpm db:bootstrap

      - name: Compile server
        run: pnpm --filter @blog/server build

      - name: Build and prerender web application
        run: pnpm --filter @blog/web build

      - name: Rehearse database and upload restore
        run: pnpm ops:rehearse-backup

      - name: Upload production web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E suite
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Integrated Docker deployment acceptance
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    env:
      BASE_URL: http://127.0.0.1:8080
      HTTP_PORT: 8080
      SESSION_SECRET: ci-docker-session-secret-at-least-32-characters-long
      ADMIN_USERNAME: NOWEN
      ADMIN_EMAIL: ci-docker@example.com
      ADMIN_PASSWORD: ci-docker-admin-password
      COMPOSE_PROJECT_NAME: nowen-blog-ci-${{ github.run_id }}
      DATA_VOLUME_NAME: nowen-blog-ci-data-${{ github.run_id }}
      BACKUP_HOST_DIR: ./.tmp/ci-backups
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare writable backup directory
        run: |
          mkdir -p .tmp/ci-backups
          chmod 0777 .tmp/ci-backups

      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.release.yml config --quiet

      - name: Build integrated production image
        run: docker compose build

      - name: Start integrated production container
        run: docker compose up -d

      - name: Wait for healthy production endpoints
        shell: bash
        run: |
          for attempt in {1..60}; do
            if node scripts/ops/verify-production.mjs --base-url "$BASE_URL" --allow-http; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Verify restart persistence and cleanup test data
        run: node scripts/ops/verify-docker-persistence.mjs --base-url "$BASE_URL" --allow-http

      - name: Create verified backup inside production container
        run: |
          docker compose exec -T blog pnpm --filter @blog/server ops:backup
          test -n "$(find .tmp/ci-backups -name manifest.json -print -quit)"

      - name: Rehearse restore inside production container
        run: docker compose exec -T blog pnpm --filter @blog/server ops:rehearse-backup

      - name: Show container logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Stop production stack
        if: always()
        run: |
          docker compose down --volumes --remove-orphans
          sudo rm -rf .tmp/ci-backups
