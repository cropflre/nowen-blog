name: nowen-blog

services:
  blog:
    build:
      context: .
      target: app
    image: nowen-blog:local
    container_name: nowen-blog
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      PORT: 8787
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      DATABASE_PATH: /app/data/blog.sqlite
      UPLOAD_DIR: /app/data/uploads
      BACKUP_DIR: /app/backups
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-10485760}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-NOWEN}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-hi@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NEWSLETTER_FROM_EMAIL: ${NEWSLETTER_FROM_EMAIL:-}
      NEWSLETTER_REPLY_TO: ${NEWSLETTER_REPLY_TO:-}
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - blog-data:/app/data
      - ${BACKUP_HOST_DIR:-./backups}:/app/backups
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "Promise.all([fetch('http://127.0.0.1/healthz'),fetch('http://127.0.0.1/api/health')]).then(rs=>{if(rs.some(r=>!r.ok))process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 25s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  blog-data:
    name: ${DATA_VOLUME_NAME:-nowen-blog-data}
