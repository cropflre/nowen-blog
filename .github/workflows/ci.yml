name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Run unit and integration tests
        run: pnpm test

      - name: Compile server
        run: pnpm --filter @blog/server build

      - name: Build web application
        run: pnpm --filter @blog/web exec vite build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E suite
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25
    env:
      BASE_URL: http://127.0.0.1:8080
      HTTP_PORT: 8080
      SESSION_SECRET: ci-session-secret-at-least-32-characters-long
      ADMIN_USERNAME: NOWEN
      ADMIN_EMAIL: ci@example.com
      ADMIN_PASSWORD: ci-admin-password
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build production images
        run: docker compose build

      - name: Start production stack
        run: docker compose up -d

      - name: Wait for healthy web endpoint
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null; then
              curl --fail --silent http://127.0.0.1:8080/api/site-settings >/dev/null
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1

      - name: Show container status
        if: always()
        run: docker compose ps

      - name: Stop production stack
        if: always()
        run: docker compose down --volumes --remove-orphans
