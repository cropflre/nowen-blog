name: Install Debug

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  install-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Capture frozen install output
        shell: bash
        run: |
          set +e
          pnpm install --frozen-lockfile > install.log 2>&1
          status=$?
          echo "$status" > install-status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: install-debug
          path: |
            install.log
            install-status.txt
          if-no-files-found: error
          retention-days: 1
