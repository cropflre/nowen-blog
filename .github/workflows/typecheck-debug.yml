name: Typecheck Debug

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture typecheck output
        shell: bash
        run: |
          set +e
          pnpm typecheck > typecheck.log 2>&1
          status=$?
          echo "$status" > typecheck-status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: typecheck-debug
          path: |
            typecheck.log
            typecheck-status.txt
          if-no-files-found: error
          retention-days: 1
