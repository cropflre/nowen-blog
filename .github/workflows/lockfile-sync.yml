name: Lockfile sync

on:
  push:
    branches: [main]
    paths:
      - package.json
      - pnpm-workspace.yaml
      - apps/**/package.json
      - packages/**/package.json
      - .github/workflows/lockfile-sync.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lockfile-sync-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Regenerate lockfile only
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Commit synchronized lockfile
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: synchronize pnpm lockfile (BLOG-20.1)"
          git push origin HEAD:main
