# nowen-blog docker-compose.yml
# Usage: docker compose up -d

services:
  blog:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nowen-blog
    ports:
      - "8080:80"
    volumes:
      # Persist database
      - blog-data:/app/data
      # Persist uploads
      - blog-uploads:/app/uploads
    environment:
      - PORT=8080
      - DATA_DIR=/app/data
      - UPLOAD_DIR=/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  blog-data:
  blog-uploads:
