name: Apply Nowen Note feature docs

on:
  push:
    branches:
      - feat/nowen-note-feature-docs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/nowen-note-feature-docs
      - name: Write feature documentation and tests
        shell: python
        run: |
          from pathlib import Path
          import base64
          import lzma
          import shutil

          root = Path('.')
          payload_dir = root / '.github/feature-docs-payload'
          payload = ''.join((payload_dir / f'part{i}.txt').read_text().strip() for i in range(1, 5))
          feature_source = lzma.decompress(base64.b64decode(payload)).decode('utf-8')
          (root / 'apps/server/src/db/seed-nowen-note-features.ts').write_text(feature_source)

          init_path = root / 'apps/server/src/db/init.ts'
          source = init_path.read_text()
          import_line = "import { ensureNowenNoteFeatureDocs } from './seed-nowen-note-features';\n"
          if import_line not in source:
              source = source.replace(
                  "import { ensureNowenNoteHelpDocs } from './seed-nowen-note-help';\n",
                  "import { ensureNowenNoteHelpDocs } from './seed-nowen-note-help';\n" + import_line,
              )
          if '  ensureNowenNoteFeatureDocs();\n' not in source:
              source = source.replace(
                  '  ensureNowenNoteHelpDocs();\n',
                  '  ensureNowenNoteHelpDocs();\n  ensureNowenNoteFeatureDocs();\n',
              )
          init_path.write_text(source)

          fresh_path = root / 'apps/server/src/db/migrations-fresh.test.ts'
          source = fresh_path.read_text()
          if "slug = 'nowen-note-features'" not in source:
              marker = "    assert.equal(brokenImagesDoc.path, 'troubleshooting/images-after-refresh');\n"
              block = r'''

    const featureSpace = sqlite
      .prepare(
        `SELECT id, name, default_version_id AS defaultVersionId, is_published AS isPublished
         FROM doc_spaces WHERE slug = 'nowen-note-features'`,
      )
      .get() as { id: string; name: string; defaultVersionId: string; isPublished: number };
    assert.equal(featureSpace.name, 'Nowen Note 功能介绍');
    assert.equal(featureSpace.isPublished, 1);
    assert.ok(featureSpace.defaultVersionId);

    const featureDocumentStats = sqlite
      .prepare(
        `SELECT COUNT(*) AS total, MAX(depth) AS maxDepth,
                SUM(CASE WHEN status = 'published' THEN 1 ELSE 0 END) AS published
         FROM documents WHERE space_id = ?`,
      )
      .get(featureSpace.id) as { total: number; maxDepth: number; published: number };
    assert.equal(featureDocumentStats.total, 37);
    assert.equal(featureDocumentStats.maxDepth, 1);
    assert.equal(featureDocumentStats.published, 37);

    const featureIndexedCount = sqlite
      .prepare(
        `SELECT COUNT(*) AS total
         FROM documents_fts f
         JOIN documents d ON d.rowid = f.rowid
         WHERE d.space_id = ?`,
      )
      .get(featureSpace.id) as { total: number };
    assert.equal(featureIndexedCount.total, 37);

    const editorDoc = sqlite
      .prepare("SELECT title, path FROM documents WHERE id = 'doc_nn_feat_richtext'")
      .get() as { title: string; path: string };
    assert.equal(editorDoc.title, '富文本编辑器');
    assert.equal(editorDoc.path, 'editing/rich-text-editor');
'''
              if marker not in source:
                  raise SystemExit('fresh migration test marker not found')
              source = source.replace(marker, marker + block, 1)
          fresh_path.write_text(source)

          migration_path = root / 'apps/server/src/db/migrations.test.ts'
          source = migration_path.read_text()
          if 'let ensureNowenNoteFeatureDocs' not in source:
              source = source.replace(
                  'let ensureNowenNoteHelpDocs: () => void;\n',
                  'let ensureNowenNoteHelpDocs: () => void;\nlet ensureNowenNoteFeatureDocs: () => void;\n',
              )
          if "await import('./seed-nowen-note-features')" not in source:
              source = source.replace(
                  "    const nowenNoteHelpSeedModule = await import('./seed-nowen-note-help');\n",
                  "    const nowenNoteHelpSeedModule = await import('./seed-nowen-note-help');\n    const nowenNoteFeatureSeedModule = await import('./seed-nowen-note-features');\n",
              )
          if 'ensureNowenNoteFeatureDocs = nowenNoteFeatureSeedModule.ensureNowenNoteFeatureDocs;' not in source:
              source = source.replace(
                  '    ensureNowenNoteHelpDocs = nowenNoteHelpSeedModule.ensureNowenNoteHelpDocs;\n',
                  '    ensureNowenNoteHelpDocs = nowenNoteHelpSeedModule.ensureNowenNoteHelpDocs;\n    ensureNowenNoteFeatureDocs = nowenNoteFeatureSeedModule.ensureNowenNoteFeatureDocs;\n',
              )
          if "slug = 'nowen-note-features'" not in source:
              marker = '    assert.ok(helpSpace?.id);\n'
              block = r'''

    const featureSpace = sqlite
      .prepare("SELECT id FROM doc_spaces WHERE slug = 'nowen-note-features'")
      .get() as { id: string } | undefined;
    assert.ok(featureSpace?.id);
'''
              if marker not in source:
                  raise SystemExit('legacy feature-space marker not found')
              source = source.replace(marker, marker + block, 1)
          if '    ensureNowenNoteFeatureDocs();\n    ensureNowenNoteFeatureDocs();\n' not in source:
              source = source.replace(
                  '    ensureNowenNoteHelpDocs();\n    ensureNowenNoteHelpDocs();\n',
                  '    ensureNowenNoteHelpDocs();\n    ensureNowenNoteHelpDocs();\n    ensureNowenNoteFeatureDocs();\n    ensureNowenNoteFeatureDocs();\n',
              )
          if 'assert.equal(featureDocumentCount.total, 37);' not in source:
              marker = '    assert.equal(helpDocumentCount.total, 28);\n'
              block = r'''

    const featureSpaceCount = sqlite
      .prepare("SELECT COUNT(*) AS total FROM doc_spaces WHERE slug = 'nowen-note-features'")
      .get() as { total: number };
    assert.equal(featureSpaceCount.total, 1);

    const featureDocumentCount = sqlite
      .prepare(
        `SELECT COUNT(*) AS total FROM documents
         WHERE space_id = (SELECT id FROM doc_spaces WHERE slug = 'nowen-note-features')`,
      )
      .get() as { total: number };
    assert.equal(featureDocumentCount.total, 37);
'''
              if marker not in source:
                  raise SystemExit('idempotence feature marker not found')
              source = source.replace(marker, marker + block, 1)
          migration_path.write_text(source)
      - name: Commit generated feature documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/src/db/seed-nowen-note-features.ts apps/server/src/db/init.ts apps/server/src/db/migrations-fresh.test.ts apps/server/src/db/migrations.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(docs): seed Nowen Note feature guide"
          git push origin HEAD:feat/nowen-note-feature-docs
