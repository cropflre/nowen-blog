# =============================================================================
# nowen-blog docker-compose.yml
#
# 使用方式：
#   开发环境：docker compose up --build
#   生产环境：docker compose -f docker-compose.yml up -d
# =============================================================================

services:
  blog:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nowen-blog
    ports:
      - "8080:80"
    volumes:
      # 持久化上传文件和数据库
      - blog-uploads:/app/uploads
      - blog-data:/app/data
    environment:
      - PORT=8080
      - GIN_MODE=release
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  blog-uploads:
  blog-data: